name: Eligibility evaluator tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/domain/eligibility/**"
      - "tests/**"
      - "docs/product/uj-2027-pilot-catalogue-draft.json"
      - ".github/workflows/eligibility-evaluator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute eligibility tests
        run: node --test tests/uj-2027-eligibility-evaluator.test.mjs tests/uj-2027-eligibility-golden-cases.test.mjs
