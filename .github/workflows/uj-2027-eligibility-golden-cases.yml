name: UJ 2027 eligibility golden-case contract tests

on:
  push:
    branches:
      - docs/uj-2027-eligibility-oracle
  pull_request:
    paths:
      - "tests/**"
      - "docs/product/uj-2027-pilot-catalogue-draft.json"
      - ".github/workflows/uj-2027-eligibility-golden-cases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-case-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run UJ 2027 golden-case contract tests
        run: node --test tests/uj-2027-eligibility-golden-cases.test.mjs
