name: Contract tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contract-tests:
    name: Node.js contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node.js test suite
        run: node --test
